# Runs every suite on every push and pull request. The app has no build step and no dependencies;
# Playwright is installed here only for the browser suites (tests/README.md). ViciDesign is checked out
# next to the app at the commit vici/ was copied from, so the suites run Vici's own checks and compare
# vici/ with it byte for byte.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Case, engine, Vici's checks, lean, docs, and the presenter in Chromium
    # Pinned image: Playwright 1.56's system dependencies are known to install on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: VictorPflueger/ViciDesign
          ref: b2c302cd896a2e92938a64dca540ea0c690be52c
          path: ViciDesign
          fetch-depth: 0
      # Victor's website, next to the app once its card for this prototype exists, so tests/page-icon.mjs
      # compares the page icon with the card; until then that part is skipped and says so.
      - run: |
          git clone -q --depth 1 https://github.com/VictorPflueger/VIP "$RUNNER_TEMP/VIP"
          if grep -q 'name: "Price Variance Agent"' "$RUNNER_TEMP/VIP/data/prototypes.js"; then mv "$RUNNER_TEMP/VIP" "$GITHUB_WORKSPACE/VIP"; else echo "The website has no card for this prototype yet: the page icon is not compared with it."; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-chromium-${{ runner.os }}
      - run: npm install -g playwright@1.56.0 && npx playwright install --with-deps chromium
      # The hygiene check reads its private term list from the HYGIENE_TERMS secret if the repository
      # has one; without it only the generic checks run (tests/hygiene.mjs).
      - name: All suites
        working-directory: app
        run: NODE_PATH="$(npm root -g)" node tests/run-all.mjs --require-vici
        env:
          HYGIENE_TERMS: ${{ secrets.HYGIENE_TERMS }}
          PV_TEST_OUT: ${{ runner.temp }}/price-variance-tests
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: ${{ runner.temp }}/price-variance-tests
